<!DOCTYPE html>
<html>
<head>
<title>My AI Video Studio</title>
<style>
textarea{
    width:100%;
    padding:15px;
    border-radius:10px;
    border:none;
    margin-top:10px;
    margin-bottom:20px;
    background:#1a1f2e;
    color:white;
}
body{
    background:#0f1117;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    padding:30px;
}

.container{
    max-width:600px;
    margin:auto;
}

h1{
    font-size:32px;
}

.subtitle{
    color:#aaa;
    margin-bottom:30px;
}

input[type="file"]{
    margin:20px 0;
}

img{
    width:100%;
    max-width:400px;
    border-radius:12px;
    margin-top:20px;
}

button{
    background:#4f46e5;
    color:white;
    border:none;
    padding:15px 30px;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

#status{
    margin-top:20px;
}

#progressBar{
    width:100%;
    height:20px;
    margin-top:10px;
}
</style>

</head>

<body>
<div class="container">

<h1>🎬 My AI Video Studio</h1>

<p class="subtitle">
画像からAI動画を生成
</p>

<input
    type="file"
    id="imageInput"
    accept="image/*">

<br>

<img id="preview">

<br><br>
<h3>動画の指示</h3>

<textarea
    id="prompt"
    placeholder="例：髪を風でなびかせながら笑顔で振り向く"
    rows="4">
</textarea>
<button id="generateBtn">
動画生成
</button>

<p id="status"></p>

<progress
    id="progressBar"
    value="0"
    max="100">
</progress>
<label for="motionStrength">
動きの強さ:
<span id="strengthValue">50</span>%
</label>

<input
type="range"
id="motionStrength"
min="1"
max="100"
value="50">
<h2>生成結果</h2>

<video
    id="videoPreview"
    controls
    width="100%"
    style="display:none; border-radius:12px;">
</video>
<br><br>

<a
    id="downloadBtn"
    href="#"
    download="my-video.mp4"
    style="
        display:none;
        background:#22c55e;
        color:white;
        padding:12px 24px;
        border-radius:10px;
        text-decoration:none;
        font-weight:bold;
    ">
    📥 動画をダウンロード
</a>
</div>
<script src="script.js"></script>
</body>
</html>
