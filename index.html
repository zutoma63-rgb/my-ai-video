<!DOCTYPE html>
<html>
<head>
<title>My AI Video Studio</title>
<script src="script.js"></script>
<style>
body{
    background:#0f1117;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    padding:30px;
}

.container{
    max-width:600px;
    margin:auto;
}

h1{
    font-size:32px;
}

.subtitle{
    color:#aaa;
    margin-bottom:30px;
}

input[type="file"]{
    margin:20px 0;
}

img{
    width:100%;
    max-width:400px;
    border-radius:12px;
    margin-top:20px;
}

button{
    background:#4f46e5;
    color:white;
    border:none;
    padding:15px 30px;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

#status{
    margin-top:20px;
}

#progressBar{
    width:100%;
    height:20px;
    margin-top:10px;
}
</style>

</head>

<body>

<h1>🎬 My AI Video Studio</h1>

<input type="file" id="imageInput" accept="image/*">

<br><br>

<img id="preview" width="300">

<br><br>

<button id="generateBtn">動画生成</button>

<p id="status"></p>

<progress
    id="progressBar"
    value="0"
    max="100"
    style="width:300px;">
</progress>
<script src="script.js"></script>
<video
    id="videoPreview"
    controls
    width="300">
</video>
</body>
</html>
